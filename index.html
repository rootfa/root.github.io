<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fahad Za3lan | f.__._</title>
  <meta name="description" content="Official personal biolink for Fahad Za3lan (f.__._) with 24/7 music player and 3D tilt." />
  
  <!-- Modern & Gothic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@700;800&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css?v=20260907_3" />
</head>
<body class="stealth-black">

  <!-- 🌌 Deep Stealth Black Background -->
  <div class="bg-wrapper">
    <div class="bg-image" id="bgImage"></div>
    <div class="bg-overlay"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <canvas id="particlesCanvas"></canvas>
  </div>

  <!-- 🚪 "Click to Enter" Screen -->
  <div class="enter-screen" id="enterScreen">
    <div class="enter-content">
      <div class="enter-icon-pulse">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <h2 class="enter-title" id="enterTitle">CLICK TO ENTER</h2>
      <p class="enter-sub" id="enterSub">Fahad Za3lan • f.__._</p>
    </div>
  </div>

  <!-- 🎴 3D Perspective Stage -->
  <main class="scene" id="scene">
    <div class="card-wrapper" id="cardWrapper">
      <div class="tilt-card" id="tiltCard">
        
        <!-- Dynamic Glare / Sheen -->
        <div class="card-glare" id="cardGlare"></div>
        <div class="card-border-glow"></div>

        <!-- 🌟 Discord Banner (Anime / Red) -->
        <div class="card-banner" id="cardBanner">
          <div class="banner-bg" id="bannerBg"></div>
          <div class="badges-row" id="badgesRow"></div>
        </div>

        <!-- 👤 Exact Vampire Discord Avatar & Online Status -->
        <div class="avatar-section">
          <div class="avatar-container" id="avatarContainer">
            <img src="assets/images/avatar.png" alt="Profile Avatar" class="avatar-img" id="avatarImg" />
            <div class="status-indicator online" id="statusIndicator" title="Online"></div>
          </div>
        </div>

        <!-- 🆔 User Identity (Fahad Za3lan) -->
        <div class="profile-info">
          <div class="name-row">
            <h1 class="display-name gothic-name" id="displayName">Fahad Za3lan</h1>
            <span class="verified-badge" title="Verified">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
            </span>
          </div>

          <!-- Discord Sub-Header: f.__._ • **The End ...** • [🛡️ Eror] -->
          <div class="discord-subline">
            <span class="discord-handle-badge" id="copyDiscordBtn" title="انقر لنسخ يوزر الديسكورد">
              <span class="tag-icon">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                  <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
              </span>
              <span class="tag-text" id="discordHandle">f.__._</span>
            </span>

            <span class="dot-sep">•</span>

            <span class="custom-status-text" id="customStatusText">**The End ...**</span>

            <span class="clan-badge" id="clanBadge" title="Server Clan">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
              </svg>
              <span>Eror</span>
            </span>
          </div>
        </div>

        <!-- 🔗 Horizontal Socials Grid (جنب بعض بنظافة وأناقة) -->
        <div class="socials-horizontal" id="socialsContainer">
          <!-- Injected via JS -->
        </div>

        <!-- 🎵 24/7 YouTube Music Player Widget -->
        <div class="music-card" id="musicPlayer">
          <div class="music-top">
            <div class="song-cover-box">
              <img src="https://img.youtube.com/vi/uQthFKGkluw/hqdefault.jpg" alt="Song Cover" class="song-cover" id="songCover" />
              <div class="cover-disc-ring"></div>
            </div>
            
            <div class="song-meta">
              <div class="song-title-wrap">
                <span class="song-title" id="songTitle">Floating in Reverie (Slowed + Reverb)</span>
              </div>
              <span class="song-artist" id="songArtist">Moayad Aljabal</span>
            </div>

            <!-- 24/7 Loop Badge & Audio Waveform -->
            <div class="music-badges-box">
              <span class="loop-247-badge" title="تشغيل مستمر 24 ساعة بدون توقف">24/7</span>
              <div class="audio-bars" id="audioBars">
                <span class="bar bar-1"></span>
                <span class="bar bar-2"></span>
                <span class="bar bar-3"></span>
                <span class="bar bar-4"></span>
                <span class="bar bar-5"></span>
              </div>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar-fill" id="progressFill"></div>
          </div>

          <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalDuration">0:00</span>
          </div>

          <!-- Player Controls -->
          <div class="player-controls">
            <button class="ctrl-btn" id="prevTrackBtn" title="السابق">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
              </svg>
            </button>

            <button class="ctrl-btn play-btn" id="playPauseBtn" title="تشغيل / إيقاف">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" id="playIcon">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" id="pauseIcon" style="display: none;">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>

            <button class="ctrl-btn" id="nextTrackBtn" title="التالي">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
              </svg>
            </button>

            <!-- Volume -->
            <div class="volume-container">
              <button class="ctrl-btn vol-btn" id="volBtn" title="كتم / صوت">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" id="volIcon">
                  <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
              </button>
              <input type="range" min="0" max="100" step="1" value="45" class="vol-slider" id="volSlider" />
            </div>
          </div>
        </div>

        <!-- 📊 Card Footer -->
        <div class="card-footer">
          <div class="footer-views">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span id="viewCount">2,049</span>
          </div>
          <div class="footer-credit">
            <span>Fahad Za3lan • rootfa</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- 🔔 Toast Notification -->
  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span class="toast-msg" id="toastMsg">تم نسخ الحساب!</span>
  </div>

  <!-- Hidden YouTube Player Container -->
  <div id="ytPlayerWrapper" style="position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; overflow: hidden; left: -9999px;">
    <div id="ytPlayer"></div>
  </div>

  <audio id="audioElement" preload="auto"></audio>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- Scripts with Cache Busting -->
  <script src="config.js?v=20260907_3"></script>
  <script src="app.js?v=20260907_3"></script>
</body>
</html>
